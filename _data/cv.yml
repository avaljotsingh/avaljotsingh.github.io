- title: Research Interests
  type: list
  contents:
    - My research centers on a bidirectional interaction between formal methods and artificial
      intelligence. On one hand, I develop formal and declarative infrastructures for building
      trustworthy AI systems, with a focus on specification, soundness verification, and efficient
      execution of AI analyses and certification procedures. On the other hand, I study how learning
      and synthesis techniques can automate formal methods themselves, enabling automatic
      construction of verification tools, program analyses, and reasoning procedures.

