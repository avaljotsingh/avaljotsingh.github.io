- title: Research Projects
  type: nested_list
  contents:
    - title: Formal Methods for AI
      items:
        - "ConstraintFlow — a declarative DSL for specifying and verifying neural network certifiers, reducing implementation complexity significantly over hand-written implementations. [SAS 2024]"
        - "ProveSound — an automated soundness verifier that formally checks certifier implementations against concrete neural network semantics. [OOPSLA 2025]"
        - "Neuton — a compiler and runtime translating ConstraintFlow specifications into efficient executables for large-scale neural network verification. [Under review]"
        - "PromptFlow — principled methods for cache eviction and memory management tailored to long-horizon, multi-step LLM agents. [Ongoing]"
    - title: AI for Formal Methods
      items:
        - "SAIL — a synthesis system that automatically generates provably sound neural network certifiers using ConstraintFlow, its verifier, and LLM-guided search over certifier designs. [PLDI 2026]"
        - "Maestro — a unified operational formalism for LLM-based theorem-proving systems, guiding proof search and generating intermediate lemmas. [VerifAI @ ICLR 2026]"
    - title: AI for Compilers
      items:
        - "RuleFlow — combines LLMs with compiler and program analysis techniques to automatically generate reusable Pandas and data-analysis optimizations. [COLM 2026]"

