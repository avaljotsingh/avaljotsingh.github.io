disqus_shortname:
collections:
  news:
    defaults:
      layout: post
    output: true
    permalink: /news/:path/
announcements:
  enabled: true
  scrollable: true
  limit: 5
latest_posts:
  enabled: true
  scrollable: true
  limit: 3
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1
include:
  - _pages
exclude:
  - bin
  - Gemfile
  - Gemfile.lock
  - vendor
keep_files:
  - CNAME
  - .nojekyll
  - .git
plugins:
  - jekyll-archives
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-imagemagick
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-toc
  - jemoji
defaults:
  - scope:
      path: assets
    values:
      sitemap: false
sass:
  style: compressed
jekyll-minifier:
  exclude:
    - robots.txt
  uglifier_args:
    harmony: true
jekyll-archives:
  enabled:
    - year
    - tags
    - categories
  layouts:
    year: archive-year
    tag: archive-tag
    category: archive-category
  permalinks:
    year: /blog/:year/
    tag: /blog/tag/:name/
    category: /blog/category/:name/
# Tags and categories listed at the top of /blog/. Empty lists still render an
# empty bar, so leave these commented out until there are posts to group.
# display_tags:
#   - formal-methods
#   - llm
# display_categories:
#   - notes
scholar:
  last_name:
    - Singh
  first_name:
    - Avaljot
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters:
    - latex
    - smallcaps
    - superscript
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details
  query: '@*'
  group_by: year
  group_order: descending
badges:
  altmetric_badge: false
  dimensions_badge: false
filtered_bibtex_keywords:
  - abbr
  - abstract
  - arxiv
  - bibtex_show
  - html
  - pdf
  - selected
  - supp
  - blog
  - code
  - poster
  - slides
  - website
  - preview
  - altmetric
max_author_limit: 10
more_authors_animation_delay: 10
external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude: null
imagemagick:
  enabled: true
  widths:
    - 480
    - 800
    - 1400
  input_directories:
    - assets/img/
  input_formats:
    - .jpg
    - .jpeg
    - .png
    - .tiff
  output_formats:
